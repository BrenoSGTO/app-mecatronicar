<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MecatroniCar</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">

    <!-- Tema/zoom/sidebar aplicados antes da primeira pintura (evita "piscar") -->
    <script src="js/theme-boot.js?v=3.0.0"></script>

    <!-- Design system (ordem importa) -->
    <link rel="stylesheet" href="css/tokens.css?v=3.0.0">
    <link rel="stylesheet" href="css/base.css?v=3.0.0">
    <link rel="stylesheet" href="css/components.css?v=3.0.0">
    <link rel="stylesheet" href="css/layout.css?v=3.0.0">

    <!-- Uma folha por tela (cada thread da Fase 2 edita só a sua) -->
    <link rel="stylesheet" href="css/views/inicio.css?v=3.0.0">
    <link rel="stylesheet" href="css/views/veiculo.css?v=3.0.0">
    <link rel="stylesheet" href="css/views/os.css?v=3.0.0">
    <link rel="stylesheet" href="css/views/fiscal.css?v=3.0.0">
    <link rel="stylesheet" href="css/views/agenda.css?v=3.0.0">
    <link rel="stylesheet" href="css/views/analytics.css?v=3.0.0">

    <link rel="stylesheet" href="css/print.css?v=3.0.0" media="print">
</head>
<body>
    <div class="app" id="app">
        <aside class="sidebar" aria-label="Navegação principal">
            <a class="sidebar-brand" href="#/inicio" title="MecatroniCar — Início">
                <img class="sidebar-logo" src="logo.png" alt="">
                <span class="sidebar-brand-text">
                    <span class="sidebar-brand-name">MecatroniCar</span>
                    <span class="sidebar-brand-version" id="app-version">v—</span>
                </span>
            </a>

            <nav class="sidebar-nav" id="sidebar-nav">
                <a class="nav-item" href="#/inicio" data-nav="inicio" data-tooltip="Início / Pátio" data-tooltip-pos="right">
                    <svg class="icon icon-20" aria-hidden="true"><use href="#i-house"></use></svg>
                    <span class="nav-label">Início</span>
                    <span class="nav-badge" data-badge="patio" hidden></span>
                </a>
                <a class="nav-item" href="#/busca" data-nav="busca" data-tooltip="Busca de veículos" data-tooltip-pos="right">
                    <svg class="icon icon-20" aria-hidden="true"><use href="#i-search"></use></svg>
                    <span class="nav-label">Busca</span>
                </a>
                <a class="nav-item" href="#/agenda" data-nav="agenda" data-tooltip="Agenda" data-tooltip-pos="right">
                    <svg class="icon icon-20" aria-hidden="true"><use href="#i-calendar-days"></use></svg>
                    <span class="nav-label">Agenda</span>
                    <span class="nav-badge" data-badge="agenda" hidden></span>
                </a>
                <a class="nav-item" href="#/fiscal" data-nav="fiscal" data-tooltip="Copiloto Fiscal" data-tooltip-pos="right">
                    <svg class="icon icon-20" aria-hidden="true"><use href="#i-receipt-text"></use></svg>
                    <span class="nav-label">Copiloto Fiscal</span>
                    <span class="nav-badge" data-badge="fiscal" hidden></span>
                </a>
                <a class="nav-item" href="#/analytics" data-nav="analytics" data-tooltip="Analytics" data-tooltip-pos="right">
                    <svg class="icon icon-20" aria-hidden="true"><use href="#i-chart-column"></use></svg>
                    <span class="nav-label">Analytics</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <a class="nav-item" href="/tv" target="_blank" rel="noopener" data-tooltip="Painel TV (abre em nova janela)" data-tooltip-pos="right">
                    <svg class="icon icon-20" aria-hidden="true"><use href="#i-tv"></use></svg>
                    <span class="nav-label">Painel TV</span>
                    <svg class="icon nav-external" aria-hidden="true"><use href="#i-external-link"></use></svg>
                </a>
                <button type="button" class="nav-item" id="sidebar-toggle" data-tooltip="Expandir menu" data-tooltip-pos="right" aria-label="Recolher ou expandir o menu lateral">
                    <svg class="icon icon-20" aria-hidden="true"><use href="#i-panel-left-close"></use></svg>
                    <span class="nav-label">Recolher menu</span>
                </button>
            </div>
        </aside>

        <header class="topbar">
            <div class="topbar-search input-group" id="topbar-search">
                <svg class="icon icon-16 input-icon" aria-hidden="true"><use href="#i-search"></use></svg>
                <input type="search" class="input" id="global-search" placeholder="Buscar placa, cliente ou modelo" autocomplete="off" spellcheck="false" aria-label="Buscar placa, cliente ou modelo">
                <span class="topbar-search-hints" aria-hidden="true"><kbd class="kbd">/</kbd><kbd class="kbd">Ctrl K</kbd></span>
                <button type="button" class="btn btn-ghost btn-icon btn-sm topbar-search-clear" id="global-search-clear" aria-label="Limpar busca" hidden>
                    <svg class="icon icon-16" aria-hidden="true"><use href="#i-x"></use></svg>
                </button>
            </div>

            <div class="topbar-actions">
                <button type="button" class="btn btn-primary" id="btn-nova-visita" title="Nova visita / ordem de serviço">
                    <svg class="icon icon-16" aria-hidden="true"><use href="#i-plus"></use></svg>
                    <span class="btn-label-collapsible">Nova visita</span>
                </button>
                <button type="button" class="btn btn-ghost btn-icon" id="btn-settings" aria-label="Configurações" data-tooltip="Configurações" data-tooltip-pos="bottom">
                    <svg class="icon icon-20" aria-hidden="true"><use href="#i-settings"></use></svg>
                </button>
            </div>
        </header>

        <main class="main" id="main">
            <div class="view-host" id="view-host"></div>
        </main>
    </div>

    <div id="modal-root"></div>
    <div class="toast-region" id="toast-region" aria-live="polite" role="status"></div>

    <!-- Catálogo de veículos (script clássico compartilhado com a TV: define window.CarCatalog) -->
    <script src="car_catalog.js?v=3.0.0"></script>
    <script type="module" src="js/main.js?v=3.0.0"></script>
</body>
</html>
