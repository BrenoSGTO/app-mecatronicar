<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 135" width="100%" height="100%">
  <defs>
    <linearGradient id="body-grad-Picape" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="glass-grad-Picape" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="shadow-Picape" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Sombra no Solo -->
  <ellipse cx="160" cy="116" rx="125" ry="7" fill="#000000" opacity="0.25"/>

  <!-- Grupo Carroceria com Sombra -->
  <g filter="url(#shadow-Picape)">
    <!-- Carroceria Principal -->
    <path d="M 32,96 L 42,92 C 48,90 54,80 58,74 L 84,72 L 110,42 C 114,38 122,36 135,36 L 210,36 C 218,36 224,42 226,48 L 226,62 L 286,62 C 292,62 296,66 296,72 L 298,90 C 298,94 294,96 290,96 Z" fill="url(#body-grad-Picape)" stroke="#0f172a" stroke-width="1.5" stroke-linejoin="round"/>
    
    <!-- Linhas de Caráter e Vinco Lateral -->
    <path d="M 54,74 Q 150,72 260,76" fill="none" stroke="#f9cc01" stroke-width="2" opacity="0.85"/>
    <path d="M 60,86 Q 160,85 250,88" fill="none" stroke="#1e293b" stroke-width="1.2" opacity="0.6"/>

    <!-- Vidros e Colunas -->
    <path d="M 115,44 L 145,44 L 145,66 L 96,66 Z M 154,44 L 214,44 C 218,44 220,46 220,50 L 220,66 L 154,66 Z" fill="url(#glass-grad-Picape)" stroke="#1e293b" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- Farol Dianteiro -->
    <path d="M 30,90 Q 36,86 46,86 L 44,92 Z" fill="#fef08a" stroke="#ca8a04" stroke-width="1"/>

    <!-- Lanterna Traseira -->
    <path d="M 280,82 Q 288,84 286,92 L 278,92 Z" fill="#ef4444" stroke="#991b1b" stroke-width="1"/>

    <line x1='135' y1='33' x2='205' y2='33' stroke='#64748b' stroke-width='2.5' stroke-linecap='round'/>
    <line x1='226' y1='62' x2='226' y2='90' stroke='#1e293b' stroke-width='2'/>
  </g>

  <!-- Roda Dianteira -->
  <g>
    <!-- Caixa de Roda Recorte -->
    <circle cx="75" cy="100" r="24" fill="none" stroke="#1e293b" stroke-width="3"/>
    <!-- Pneu -->
    <circle cx="75" cy="100" r="22" fill="#0f172a"/>
    <!-- Roda de Liga Leve -->
    <circle cx="75" cy="100" r="16" fill="#cbd5e1" stroke="#64748b" stroke-width="1"/>
    <!-- Raios da Roda -->
    <circle cx="75" cy="100" r="4" fill="#f9cc01"/>
    <line x1="65" y1="100" x2="85" y2="100" stroke="#475569" stroke-width="2"/>
    <line x1="75" y1="90" x2="75" y2="110" stroke="#475569" stroke-width="2"/>
  </g>

  <!-- Roda Traseira -->
  <g>
    <!-- Caixa de Roda Recorte -->
    <circle cx="252" cy="100" r="24" fill="none" stroke="#1e293b" stroke-width="3"/>
    <!-- Pneu -->
    <circle cx="252" cy="100" r="22" fill="#0f172a"/>
    <!-- Roda de Liga Leve -->
    <circle cx="252" cy="100" r="16" fill="#cbd5e1" stroke="#64748b" stroke-width="1"/>
    <!-- Raios da Roda -->
    <circle cx="252" cy="100" r="4" fill="#f9cc01"/>
    <line x1="242" y1="100" x2="262" y2="100" stroke="#475569" stroke-width="2"/>
    <line x1="252" y1="90" x2="252" y2="110" stroke="#475569" stroke-width="2"/>
  </g>

  <!-- Rótulo do Modelo (Metadado Sutil) -->
  <text x="160" y="130" font-family="'Segoe UI', -apple-system, sans-serif" font-size="9" font-weight="700" fill="#64748b" text-anchor="middle" letter-spacing="1">OFICINA PICAPE</text>
</svg>