<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 135" width="100%" height="100%">
  <defs>
    <linearGradient id="body-grad-Kwid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="glass-grad-Kwid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="shadow-Kwid" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Sombra no Solo -->
  <ellipse cx="160" cy="116" rx="125" ry="7" fill="#000000" opacity="0.25"/>

  <!-- Grupo Carroceria com Sombra -->
  <g filter="url(#shadow-Kwid)">
    <!-- Carroceria Principal -->
    <path d="M 34,96 L 44,92 C 50,90 56,80 60,74 L 84,72 L 106,38 C 110,34 116,32 126,32 L 204,32 C 210,32 216,36 218,42 L 230,76 C 232,82 236,88 244,90 L 244,94 C 244,96 240,96 236,96 Z" fill="url(#body-grad-Kwid)" stroke="#0f172a" stroke-width="1.5" stroke-linejoin="round"/>
    
    <!-- Linhas de Caráter e Vinco Lateral -->
    <path d="M 54,74 Q 150,72 260,76" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.85"/>
    <path d="M 60,86 Q 160,85 250,88" fill="none" stroke="#1e293b" stroke-width="1.2" opacity="0.6"/>

    <!-- Vidros e Colunas -->
    <path d="M 110,40 L 150,40 L 150,66 L 94,66 Z M 158,40 L 198,40 C 202,40 206,44 208,48 L 216,66 L 158,66 Z" fill="url(#glass-grad-Kwid)" stroke="#1e293b" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- Farol Dianteiro -->
    <path d="M 30,90 Q 36,86 46,86 L 44,92 Z" fill="#fef08a" stroke="#ca8a04" stroke-width="1"/>

    <!-- Lanterna Traseira -->
    <path d="M 280,82 Q 288,84 286,92 L 278,92 Z" fill="#ef4444" stroke="#991b1b" stroke-width="1"/>

    
    
  </g>

  <!-- Roda Dianteira -->
  <g>
    <!-- Caixa de Roda Recorte -->
    <circle cx="76" cy="100" r="21" fill="none" stroke="#1e293b" stroke-width="3"/>
    <!-- Pneu -->
    <circle cx="76" cy="100" r="19" fill="#0f172a"/>
    <!-- Roda de Liga Leve -->
    <circle cx="76" cy="100" r="13" fill="#cbd5e1" stroke="#64748b" stroke-width="1"/>
    <!-- Raios da Roda -->
    <circle cx="76" cy="100" r="4" fill="#f59e0b"/>
    <line x1="66" y1="100" x2="86" y2="100" stroke="#475569" stroke-width="2"/>
    <line x1="76" y1="90" x2="76" y2="110" stroke="#475569" stroke-width="2"/>
  </g>

  <!-- Roda Traseira -->
  <g>
    <!-- Caixa de Roda Recorte -->
    <circle cx="198" cy="100" r="21" fill="none" stroke="#1e293b" stroke-width="3"/>
    <!-- Pneu -->
    <circle cx="198" cy="100" r="19" fill="#0f172a"/>
    <!-- Roda de Liga Leve -->
    <circle cx="198" cy="100" r="13" fill="#cbd5e1" stroke="#64748b" stroke-width="1"/>
    <!-- Raios da Roda -->
    <circle cx="198" cy="100" r="4" fill="#f59e0b"/>
    <line x1="188" y1="100" x2="208" y2="100" stroke="#475569" stroke-width="2"/>
    <line x1="198" y1="90" x2="198" y2="110" stroke="#475569" stroke-width="2"/>
  </g>

  <!-- Rótulo do Modelo (Metadado Sutil) -->
  <text x="160" y="130" font-family="'Segoe UI', -apple-system, sans-serif" font-size="9" font-weight="700" fill="#64748b" text-anchor="middle" letter-spacing="1">RENAULT KWID</text>
</svg>