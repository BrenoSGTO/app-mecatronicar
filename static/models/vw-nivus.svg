<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 135" width="100%" height="100%">
  <defs>
    <linearGradient id="body-grad-Nivus" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="glass-grad-Nivus" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="shadow-Nivus" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Sombra no Solo -->
  <ellipse cx="160" cy="116" rx="125" ry="7" fill="#000000" opacity="0.25"/>

  <!-- Grupo Carroceria com Sombra -->
  <g filter="url(#shadow-Nivus)">
    <!-- Carroceria Principal -->
    <path d="M 30,96 L 40,90 C 46,88 52,78 56,72 L 82,70 L 108,40 C 112,36 120,34 130,34 L 232,34 C 238,34 244,38 248,44 L 262,68 C 266,74 270,80 278,84 L 280,92 C 280,96 276,96 272,96 Z" fill="url(#body-grad-Nivus)" stroke="#0f172a" stroke-width="1.5" stroke-linejoin="round"/>
    
    <!-- Linhas de Caráter e Vinco Lateral -->
    <path d="M 54,74 Q 150,72 260,76" fill="none" stroke="#0284c7" stroke-width="2" opacity="0.85"/>
    <path d="M 60,86 Q 160,85 250,88" fill="none" stroke="#1e293b" stroke-width="1.2" opacity="0.6"/>

    <!-- Vidros e Colunas -->
    <path d="M 114,42 L 152,42 L 152,65 L 96,65 Z M 160,42 L 208,42 L 208,65 L 160,65 Z M 216,42 L 234,42 C 238,42 242,46 244,50 L 254,65 L 216,65 Z" fill="url(#glass-grad-Nivus)" stroke="#1e293b" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- Farol Dianteiro -->
    <path d="M 30,90 Q 36,86 46,86 L 44,92 Z" fill="#fef08a" stroke="#ca8a04" stroke-width="1"/>

    <!-- Lanterna Traseira -->
    <path d="M 280,82 Q 288,84 286,92 L 278,92 Z" fill="#ef4444" stroke="#991b1b" stroke-width="1"/>

    <line x1='130' y1='30' x2='228' y2='30' stroke='#64748b' stroke-width='2.5' stroke-linecap='round'/>
    
  </g>

  <!-- Roda Dianteira -->
  <g>
    <!-- Caixa de Roda Recorte -->
    <circle cx="74" cy="100" r="23" fill="none" stroke="#1e293b" stroke-width="3"/>
    <!-- Pneu -->
    <circle cx="74" cy="100" r="21" fill="#0f172a"/>
    <!-- Roda de Liga Leve -->
    <circle cx="74" cy="100" r="15" fill="#cbd5e1" stroke="#64748b" stroke-width="1"/>
    <!-- Raios da Roda -->
    <circle cx="74" cy="100" r="4" fill="#0284c7"/>
    <line x1="64" y1="100" x2="84" y2="100" stroke="#475569" stroke-width="2"/>
    <line x1="74" y1="90" x2="74" y2="110" stroke="#475569" stroke-width="2"/>
  </g>

  <!-- Roda Traseira -->
  <g>
    <!-- Caixa de Roda Recorte -->
    <circle cx="234" cy="100" r="23" fill="none" stroke="#1e293b" stroke-width="3"/>
    <!-- Pneu -->
    <circle cx="234" cy="100" r="21" fill="#0f172a"/>
    <!-- Roda de Liga Leve -->
    <circle cx="234" cy="100" r="15" fill="#cbd5e1" stroke="#64748b" stroke-width="1"/>
    <!-- Raios da Roda -->
    <circle cx="234" cy="100" r="4" fill="#0284c7"/>
    <line x1="224" y1="100" x2="244" y2="100" stroke="#475569" stroke-width="2"/>
    <line x1="234" y1="90" x2="234" y2="110" stroke="#475569" stroke-width="2"/>
  </g>

  <!-- Rótulo do Modelo (Metadado Sutil) -->
  <text x="160" y="130" font-family="'Segoe UI', -apple-system, sans-serif" font-size="9" font-weight="700" fill="#64748b" text-anchor="middle" letter-spacing="1">VOLKSWAGEN NIVUS</text>
</svg>