<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 135" width="100%" height="100%">
  <defs>
    <linearGradient id="body-grad-Yaris Sedan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="glass-grad-Yaris Sedan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="shadow-Yaris Sedan" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Sombra no Solo -->
  <ellipse cx="160" cy="116" rx="125" ry="7" fill="#000000" opacity="0.25"/>

  <!-- Grupo Carroceria com Sombra -->
  <g filter="url(#shadow-Yaris Sedan)">
    <!-- Carroceria Principal -->
    <path d="M 26,96 L 36,92 C 42,90 48,82 52,76 L 82,72 L 106,42 C 110,38 118,36 128,36 L 208,36 C 218,36 226,42 232,48 L 254,68 L 284,70 C 290,70 294,74 294,80 L 294,92 C 294,96 290,96 286,96 Z" fill="url(#body-grad-Yaris Sedan)" stroke="#0f172a" stroke-width="1.5" stroke-linejoin="round"/>
    
    <!-- Linhas de Caráter e Vinco Lateral -->
    <path d="M 54,74 Q 150,72 260,76" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.85"/>
    <path d="M 60,86 Q 160,85 250,88" fill="none" stroke="#1e293b" stroke-width="1.2" opacity="0.6"/>

    <!-- Vidros e Colunas -->
    <path d="M 112,44 L 155,44 L 155,67 L 96,67 Z M 163,44 L 206,44 C 212,44 218,48 222,54 L 236,67 L 163,67 Z" fill="url(#glass-grad-Yaris Sedan)" stroke="#1e293b" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- Farol Dianteiro -->
    <path d="M 30,90 Q 36,86 46,86 L 44,92 Z" fill="#fef08a" stroke="#ca8a04" stroke-width="1"/>

    <!-- Lanterna Traseira -->
    <path d="M 280,82 Q 288,84 286,92 L 278,92 Z" fill="#ef4444" stroke="#991b1b" stroke-width="1"/>

    
    
  </g>

  <!-- Roda Dianteira -->
  <g>
    <!-- Caixa de Roda Recorte -->
    <circle cx="75" cy="100" r="22" fill="none" stroke="#1e293b" stroke-width="3"/>
    <!-- Pneu -->
    <circle cx="75" cy="100" r="20" fill="#0f172a"/>
    <!-- Roda de Liga Leve -->
    <circle cx="75" cy="100" r="14" fill="#cbd5e1" stroke="#64748b" stroke-width="1"/>
    <!-- Raios da Roda -->
    <circle cx="75" cy="100" r="4" fill="#ef4444"/>
    <line x1="65" y1="100" x2="85" y2="100" stroke="#475569" stroke-width="2"/>
    <line x1="75" y1="90" x2="75" y2="110" stroke="#475569" stroke-width="2"/>
  </g>

  <!-- Roda Traseira -->
  <g>
    <!-- Caixa de Roda Recorte -->
    <circle cx="240" cy="100" r="22" fill="none" stroke="#1e293b" stroke-width="3"/>
    <!-- Pneu -->
    <circle cx="240" cy="100" r="20" fill="#0f172a"/>
    <!-- Roda de Liga Leve -->
    <circle cx="240" cy="100" r="14" fill="#cbd5e1" stroke="#64748b" stroke-width="1"/>
    <!-- Raios da Roda -->
    <circle cx="240" cy="100" r="4" fill="#ef4444"/>
    <line x1="230" y1="100" x2="250" y2="100" stroke="#475569" stroke-width="2"/>
    <line x1="240" y1="90" x2="240" y2="110" stroke="#475569" stroke-width="2"/>
  </g>

  <!-- Rótulo do Modelo (Metadado Sutil) -->
  <text x="160" y="130" font-family="'Segoe UI', -apple-system, sans-serif" font-size="9" font-weight="700" fill="#64748b" text-anchor="middle" letter-spacing="1">TOYOTA YARIS SEDAN</text>
</svg>